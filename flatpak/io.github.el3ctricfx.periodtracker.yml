# flatpak/io.github.el3ctricfx.periodtracker.yml
app-id: io.github.el3ctricfx.periodtracker
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: period-tracker

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  - --env=GDK_BACKEND=x11

modules:
  - name: patchelf
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        path: patchelf-0.18.0.tar.bz2
        strip-components: 1

  - name: period-tracker
    buildsystem: simple
    build-commands:
      - ar x period-tracker_0.1.0_amd64.deb
      - tar -xf data.tar.* -C /app

      - patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 /app/usr/bin/period-tracker
      - patchelf --remove-rpath /app/usr/bin/period-tracker
      - install -Dm755 /app/usr/bin/period-tracker /app/bin/period-tracker

      - |
        for dir in /app/usr/share/icons/hicolor/*/apps; do
          [ -d "$dir" ] || continue
          size=$(basename "$(dirname "$dir")")
          for f in "$dir"/*.png; do
            [ -f "$f" ] || continue
            install -Dm644 "$f" "/app/share/icons/hicolor/${size}/apps/io.github.el3ctricfx.periodtracker.png"
          done
        done

      - |
        sed -e 's|^Exec=.*|Exec=period-tracker|' \
            -e 's|^Icon=.*|Icon=io.github.el3ctricfx.periodtracker|' \
            /app/usr/share/applications/period-tracker.desktop \
            > /tmp/period-tracker.desktop
        install -Dm644 /tmp/period-tracker.desktop /app/share/applications/io.github.el3ctricfx.periodtracker.desktop
    sources:
      - type: file
        path: ../src-tauri/target/release/bundle/deb/period-tracker_0.1.0_amd64.deb